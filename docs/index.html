<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bug Log Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container { max-width: 800px; margin: 0 auto; }

    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    header h1 { font-size: 1.8rem; color: #fff; }
    header span { font-size: 1.8rem; }

    /* â”€â”€ Form â”€â”€ */
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .card h2 { font-size: 1rem; color: #aaa; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .form-grid .full { grid-column: 1 / -1; }

    label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 0.3rem; }

    input, textarea {
      width: 100%;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e0e0e0;
      padding: 0.6rem 0.75rem;
      font-size: 0.9rem;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    textarea { resize: vertical; min-height: 80px; }
    input:focus, textarea:focus { outline: none; border-color: #e74c3c; }

    .btn {
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary { background: #e74c3c; color: #fff; }
    .btn-edit    { background: #2a2a2a; color: #ccc; font-size: 0.8rem; padding: 0.35rem 0.8rem; }
    .btn-delete  { background: transparent; color: #e74c3c; border: 1px solid #e74c3c; font-size: 0.8rem; padding: 0.35rem 0.8rem; }
    .btn-save    { background: #27ae60; color: #fff; font-size: 0.8rem; padding: 0.35rem 0.8rem; }
    .btn-cancel  { background: #2a2a2a; color: #ccc; font-size: 0.8rem; padding: 0.35rem 0.8rem; }

    /* â”€â”€ Bug list â”€â”€ */
    .bugs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .bugs-header h2 { font-size: 1rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.05em; }
    .count-badge {
      background: #e74c3c;
      color: #fff;
      border-radius: 99px;
      padding: 0.1rem 0.55rem;
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* â”€â”€ States â”€â”€ */
    .spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 3rem 0;
      color: #666;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #2a2a2a;
      border-top-color: #e74c3c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      text-align: center;
      padding: 3rem 0;
      color: #555;
    }

    .error-banner {
      background: #2d0b0b;
      border: 1px solid #e74c3c;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: #e74c3c;
      margin-bottom: 1rem;
      font-size: 0.88rem;
    }

    /* â”€â”€ Bug card â”€â”€ */
    .bug-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      transition: border-color 0.15s;
    }
    .bug-card:hover { border-color: #3a3a3a; }

    .bug-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.4rem;
    }

    .bug-desc { font-size: 0.88rem; color: #999; margin-bottom: 0.75rem; line-height: 1.5; }

    .bug-meta { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.75rem; }

    .meta-item { font-size: 0.78rem; color: #666; }
    .meta-item strong { color: #aaa; }

    .tags { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .tag {
      background: #1e1e2e;
      border: 1px solid #333;
      border-radius: 99px;
      padding: 0.15rem 0.6rem;
      font-size: 0.72rem;
      color: #888;
    }

    .bug-actions { display: flex; gap: 0.5rem; }

    /* â”€â”€ Edit form inline â”€â”€ */
    .edit-form { margin-top: 1rem; display: grid; gap: 0.6rem; }
    .edit-actions { display: flex; gap: 0.5rem; }

    .date { font-size: 0.72rem; color: #444; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span>ðŸ›</span>
      <h1>Bug Log Tracker</h1>
    </header>

    <!-- Log a new bug -->
    <div class="card">
      <h2>Log a Bug</h2>
      <form id="bugForm">
        <div class="form-grid">
          <div class="full">
            <label for="title">Bug Title *</label>
            <input id="title" type="text" placeholder="e.g. CORS error on POST /users" required />
          </div>
          <div class="full">
            <label for="description">What happened? *</label>
            <textarea id="description" placeholder="Describe what you were doing and what went wrong..." required></textarea>
          </div>
          <div>
            <label for="error_message">Error Message</label>
            <textarea id="error_message" style="min-height:60px" placeholder="Paste the error message here..."></textarea>
          </div>
          <div>
            <label for="fix">How did you fix it?</label>
            <textarea id="fix" style="min-height:60px" placeholder="What solved it? Leave blank if unsolved."></textarea>
          </div>
          <div class="full">
            <label for="tags">Tags (comma-separated)</label>
            <input id="tags" type="text" placeholder="e.g. cors, express, backend" />
          </div>
        </div>
        <div style="margin-top:1rem">
          <button type="submit" class="btn btn-primary" id="submitBtn">+ Log Bug</button>
        </div>
      </form>
    </div>

    <!-- Bug list -->
    <div class="bugs-header">
      <h2>Your Bug Logs</h2>
      <span class="count-badge" id="countBadge">0</span>
    </div>

    <div id="errorBanner" class="error-banner" style="display:none"></div>
    <div id="bugsContainer"></div>
  </div>

  <script>
    // â”€â”€ Config â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    // Change this to your deployed Render URL before going live
    const BACKEND_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:3000'
      : 'https://bug-log-tracker.onrender.com';

    // â”€â”€ State â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    let bugs = [];

    // â”€â”€ Helpers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function showError(msg) {
      const banner = document.getElementById('errorBanner');
      banner.textContent = msg;
      banner.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorBanner').style.display = 'none';
    }

    function formatDate(dt) {
      return new Date(dt).toLocaleString('en-IN', {
        day: 'numeric', month: 'short', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function parseTags(tagStr) {
      if (!tagStr) return [];
      return tagStr.split(',').map(t => t.trim()).filter(Boolean);
    }

    // â”€â”€ Render â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function renderBugs() {
      const container = document.getElementById('bugsContainer');
      document.getElementById('countBadge').textContent = bugs.length;

      if (bugs.length === 0) {
        container.innerHTML = '<div class="empty-state">No bugs logged yet. Log your first one above! ðŸŽ‰</div>';
        return;
      }

      container.innerHTML = bugs.map(bug => `
        <div class="bug-card" id="card-${bug.id}">
          <div class="bug-title">${escHtml(bug.title)}</div>
          <div class="bug-desc">${escHtml(bug.description)}</div>

          ${bug.error_message ? `<div class="meta-item" style="margin-bottom:0.5rem"><strong>Error:</strong> <code style="font-size:0.78rem;color:#e74c3c">${escHtml(bug.error_message)}</code></div>` : ''}
          ${bug.fix ? `<div class="meta-item" style="margin-bottom:0.5rem"><strong>Fix:</strong> ${escHtml(bug.fix)}</div>` : ''}

          ${parseTags(bug.tags).length > 0 ? `
            <div class="tags">${parseTags(bug.tags).map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}</div>
          ` : ''}

          <div class="date">${formatDate(bug.created_at)}</div>

          <div class="bug-actions" style="margin-top:0.75rem">
            <button class="btn btn-edit" onclick="startEdit(${bug.id})">Edit</button>
            <button class="btn btn-delete" onclick="deleteBug(${bug.id})">Delete</button>
          </div>

          <!-- Inline edit form (hidden by default) -->
          <div class="edit-form" id="edit-${bug.id}" style="display:none">
            <div>
              <label>Title *</label>
              <input id="edit-title-${bug.id}" value="${escAttr(bug.title)}" />
            </div>
            <div>
              <label>What happened? *</label>
              <textarea id="edit-desc-${bug.id}">${escHtml(bug.description)}</textarea>
            </div>
            <div>
              <label>Error Message</label>
              <textarea id="edit-err-${bug.id}" style="min-height:50px">${escHtml(bug.error_message || '')}</textarea>
            </div>
            <div>
              <label>Fix</label>
              <textarea id="edit-fix-${bug.id}" style="min-height:50px">${escHtml(bug.fix || '')}</textarea>
            </div>
            <div>
              <label>Tags</label>
              <input id="edit-tags-${bug.id}" value="${escAttr(bug.tags || '')}" />
            </div>
            <div class="edit-actions">
              <button class="btn btn-save" onclick="saveEdit(${bug.id})">Save</button>
              <button class="btn btn-cancel" onclick="cancelEdit(${bug.id})">Cancel</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escAttr(str) {
      return String(str).replace(/"/g, '&quot;');
    }

    // â”€â”€ READ â€” fetch all bugs on load â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    async function loadBugs() {
      const container = document.getElementById('bugsContainer');
      container.innerHTML = `
        <div class="spinner-wrap">
          <div class="spinner"></div>
          <p>Connecting to backendâ€¦ (may take 30â€“60s on cold start)</p>
        </div>`;

      try {
        const res = await fetch(`${BACKEND_URL}/bugs`);
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        bugs = await res.json();
        hideError();
        renderBugs();
      } catch (err) {
        container.innerHTML = '';
        showError(`Could not load bugs: ${err.message}. The backend may be starting up â€” try again in a moment.`);
      }
    }

    // â”€â”€ CREATE â€” submit form â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    document.getElementById('bugForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Loggingâ€¦';

      const payload = {
        title:         document.getElementById('title').value.trim(),
        description:   document.getElementById('description').value.trim(),
        error_message: document.getElementById('error_message').value.trim(),
        fix:           document.getElementById('fix').value.trim(),
        tags:          document.getElementById('tags').value.trim(),
      };

      try {
        const res = await fetch(`${BACKEND_URL}/bugs`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        const newBug = await res.json();
        bugs.unshift(newBug);
        renderBugs();
        e.target.reset();
        hideError();
      } catch (err) {
        showError(`Could not log bug: ${err.message}`);
      } finally {
        btn.disabled = false;
        btn.textContent = '+ Log Bug';
      }
    });

    // â”€â”€ UPDATE â€” inline edit â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    function startEdit(id) {
      document.getElementById(`edit-${id}`).style.display = 'grid';
    }

    function cancelEdit(id) {
      document.getElementById(`edit-${id}`).style.display = 'none';
    }

    async function saveEdit(id) {
      const payload = {
        title:         document.getElementById(`edit-title-${id}`).value.trim(),
        description:   document.getElementById(`edit-desc-${id}`).value.trim(),
        error_message: document.getElementById(`edit-err-${id}`).value.trim(),
        fix:           document.getElementById(`edit-fix-${id}`).value.trim(),
        tags:          document.getElementById(`edit-tags-${id}`).value.trim(),
      };

      try {
        const res = await fetch(`${BACKEND_URL}/bugs/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        const updated = await res.json();
        bugs = bugs.map(b => b.id === id ? updated : b);
        renderBugs();
        hideError();
      } catch (err) {
        showError(`Could not update bug: ${err.message}`);
      }
    }

    // â”€â”€ DELETE â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    async function deleteBug(id) {
      if (!confirm('Delete this bug log permanently?')) return;

      try {
        const res = await fetch(`${BACKEND_URL}/bugs/${id}`, { method: 'DELETE' });
        if (!res.ok && res.status !== 204) throw new Error(`Server error: ${res.status}`);
        bugs = bugs.filter(b => b.id !== id);
        renderBugs();
        hideError();
      } catch (err) {
        showError(`Could not delete bug: ${err.message}`);
      }
    }

    // â”€â”€ Init â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    loadBugs();
  </script>
</body>
</html>
